name: Build & Release FiveM Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Configure Git
        run: git config --global core.symlinks true

      - name: Clone FiveM repository
        shell: cmd
        run: |
          git clone https://github.com/Gogsi/fivem.git -b wine-win10 -c core.symlinks=true
          cd fivem
          git submodule update --jobs=16 --init

      - name: Create libnode directory
        run: mkdir fivem\vendor\libnode\bin

      - name: Download libnode release assets
        shell: powershell
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/citizenfx/libnode/releases/tags/v22.22.0"

          $assets = $release.assets | Where-Object {
            $_.name -notmatch "source"
          }

          foreach ($asset in $assets) {
            $out = "fivem/vendor/libnode/bin/$($asset.name)"
            Write-Host "Downloading $($asset.name)"
            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile $out
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install setuptools
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: git make mingw-w64-x86_64-toolchain

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Chrome
        working-directory: fivem
        shell: cmd
        run: fxd get-chrome

      - name: Prebuild natives
        working-directory: fivem
        shell: cmd
        run: prebuild

      - name: Generate project files
        working-directory: fivem
        shell: cmd
        run: |
          fxd gen -game five
          fxd vs -game five

      - name: Build solution
        working-directory: fivem
        shell: cmd
        run: |
          msbuild /m /p:Configuration=Release CitizenMP.sln

      - name: Archive bin folder
        shell: powershell
        run: |
          Compress-Archive `
            -Path "fivem/code/bin/*" `
            -DestinationPath "fivem-bin.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FiveM Build ${{ github.run_number }}
          files: fivem-bin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
