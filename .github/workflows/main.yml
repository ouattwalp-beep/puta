name: Build FiveM (Gogsi Fork - wine-win10)

on:
  push:
    branches: [ "wine-win10" ]
  pull_request:
    branches: [ "wine-win10" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Configure Git Symlinks
        run: |
          git config --global core.symlinks true

      - name: Checkout Gogsi Fork
        uses: actions/checkout:v4
        with:
          repository: 'Gogsi/fivem'
          ref: 'wine-win10'
          submodules: false # Handled manually below for precision
          fetch-depth: 0

      - name: Setup Environment Variables
        run: |
          echo "GIT_LFS_SKIP_SMUDGE=1" >> $GITHUB_ENV

      - name: Update Submodules
        shell: cmd
        run: |
          git submodule update --jobs=16 --init

      - name: Install Build Dependencies
        run: |
          # Install MSYS2 to the specific required path
          choco install msys2 -y --params "/NoUpdate /InstallDir:C:\msys64"
          
          # Setup Python requirements
          python -m pip install --upgrade pip
          pip install setuptools
          
          # Ensure Yarn is available
          npm install --global yarn

      - name: Inject libnode Assets
        shell: pwsh
        run: |
          $url = "https://github.com/citizenfx/libnode/releases/download/v22.22.0/libnode-v22.22.0-windows-x64.zip"
          $dest = "vendor/libnode/bin"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest }
          
          Invoke-WebRequest -Uri $url -OutFile "libnode_assets.zip"
          Expand-Archive -Path "libnode_assets.zip" -DestinationPath $dest -Force
          Remove-Item "libnode_assets.zip"

      - name: Run Build Environment Setup
        shell: cmd
        run: |
          :: Ensure local scripts are executable
          set PATH=%CD%;%PATH%
          
          :: Execute Cfx.re build chain
          call fxd get-chrome
          call prebuild
          
          :: Generate solution for FiveM
          call fxd gen -game five
          
          :: Compile using MSBuild
          msbuild code/client/citizen/citizen.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fivem-wine-win10-bin
          path: code/bin/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: code/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
