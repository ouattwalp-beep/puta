name: Build FiveM Gogsi Fork

on:
  push:
    branches: [ "wine-win10" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clean Workspace
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse | Remove-Item -Force -Recurse
        shell: pwsh

      - name: Manual Clone Gogsi Fork
        shell: cmd
        run: |
          git config --global core.symlinks true
          set GIT_LFS_SKIP_SMUDGE=1
          git clone https://github.com/Gogsi/fivem.git -b wine-win10 -c core.symlinks=true .
          git submodule update --jobs=16 --init

      - name: Install Build Dependencies
        run: |
          choco install msys2 -y --params "/NoUpdate /InstallDir:C:\msys64"
          python -m pip install --upgrade pip
          pip install setuptools
          npm install --global yarn

      - name: Inject libnode Assets
        shell: pwsh
        run: |
          $dest = "vendor/libnode/bin"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest }
          
          $baseUrl = "https://github.com/citizenfx/libnode/releases/download/v22.22.0"
          $files = @(
            "libnode22.dll", 
            "libnode22.lib", 
            "libnode22.pdb", 
            "libuv.dll", 
            "libuv.lib", 
            "libuv.pdb"
          )

          foreach ($file in $files) {
            Write-Host "Downloading $file..."
            $url = "$baseUrl/$file"
            Invoke-WebRequest -Uri $url -OutFile "$dest/$file" -MaximumRetryCount 3
          }

      - name: Run Build Environment Setup
        shell: cmd
        run: |
          :: Download Chrome
          call fxd get-chrome
          
          :: Build bindings
          call prebuild
          
          :: Generate solution
          call fxd gen -game five
          
          :: Compile using MSBuild
          msbuild code/client/citizen/citizen.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fivem-gogsi-bin
          path: code/bin/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: code/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
